<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="kam — meat">
  <!-- bone (behind the meat) -->
  <g fill="#fbf6ee" stroke="#4a3b2f" stroke-width="4" stroke-linejoin="round">
    <rect x="18" y="69" width="46" height="15" rx="7.5" transform="rotate(-42 41 76.5)" />
    <circle cx="20" cy="92" r="7.5" />
    <circle cx="30" cy="101" r="7.5" />
  </g>
  <!-- meat: seared outer -->
  <ellipse cx="77" cy="51" rx="31" ry="35" transform="rotate(-15 77 51)"
           fill="#c45c54" stroke="#4a3b2f" stroke-width="4" />
  <!-- meat: tender inside -->
  <ellipse cx="77" cy="53" rx="19" ry="23" transform="rotate(-15 77 53)" fill="#eaa199" />
  <!-- highlight -->
  <ellipse cx="69" cy="44" rx="6" ry="4" transform="rotate(-15 69 44)" fill="#ffffff" opacity="0.5" />
</svg>
