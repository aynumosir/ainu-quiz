<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="seta — dog">
  <!-- ears -->
  <g fill="#cf9f63" stroke="#4a3b2f" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="29" cy="46" rx="13" ry="22" transform="rotate(-22 29 46)" />
    <ellipse cx="91" cy="46" rx="13" ry="22" transform="rotate(22 91 46)" />
  </g>
  <!-- head -->
  <circle cx="60" cy="58" r="34" fill="#e8c489" stroke="#4a3b2f" stroke-width="4" />
  <!-- muzzle -->
  <ellipse cx="60" cy="70" rx="21" ry="15" fill="#f6e3c4" stroke="#4a3b2f" stroke-width="3" />
  <!-- eyes -->
  <circle cx="48" cy="52" r="5" fill="#4a3b2f" />
  <circle cx="72" cy="52" r="5" fill="#4a3b2f" />
  <circle cx="46.4" cy="50.4" r="1.7" fill="#fff" />
  <circle cx="70.4" cy="50.4" r="1.7" fill="#fff" />
  <!-- nose + mouth -->
  <ellipse cx="60" cy="62" rx="6" ry="4.5" fill="#4a3b2f" />
  <path d="M60 66 L60 72 M60 72 Q52 79 47 72 M60 72 Q68 79 73 72" fill="none" stroke="#4a3b2f" stroke-width="3" stroke-linecap="round" />
  <!-- tongue -->
  <path d="M55 74 Q60 85 65 74 Z" fill="#f3a3b6" stroke="#4a3b2f" stroke-width="2.5" stroke-linejoin="round" />
  <!-- blush -->
  <circle cx="39" cy="64" r="5" fill="#f3a3b6" opacity="0.6" />
  <circle cx="81" cy="64" r="5" fill="#f3a3b6" opacity="0.6" />
</svg>
