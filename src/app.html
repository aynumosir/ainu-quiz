<!doctype html>
<html lang="ja" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<title>tu itak — Learn Ainu | アイヌ語を学ぼう</title>
		<meta
			name="description"
			content="Learn Ainu the Duolingo way: free, bite-sized lessons in Latin script and Katakana, with a distinctly Ainu design. アイヌ語を、ラテン文字とカタカナで楽しく学べる無料アプリ。"
		/>
		<link rel="canonical" href="https://quiz.aynu.org/" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#1d3461" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171f" />

		<!-- Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<!-- PWA -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="application-name" content="tu itak" />
		<meta name="apple-mobile-web-app-title" content="tu itak" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="tu itak" />
		<meta property="og:title" content="tu itak — Learn Ainu" />
		<meta
			property="og:description"
			content="Learn Ainu the Duolingo way: bite-sized lessons in Latin and Katakana. アイヌ語を、ふたつの文字で楽しく学べる無料アプリ。"
		/>
		<meta property="og:url" content="https://quiz.aynu.org/" />
		<meta property="og:image" content="https://quiz.aynu.org/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="tu itak — Learn Ainu, both scripts at once" />
		<meta property="og:locale" content="ja_JP" />
		<meta property="og:locale:alternate" content="en_US" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="tu itak — Learn Ainu" />
		<meta
			name="twitter:description"
			content="Learn Ainu the Duolingo way: bite-sized lessons in Latin and Katakana. アイヌ語を、ふたつの文字で。"
		/>
		<meta name="twitter:image" content="https://quiz.aynu.org/og.png" />

		<meta name="robots" content="index, follow, max-image-preview:large" />

		<!-- Structured data -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "tu itak",
				"alternateName": "tu itak — Learn Ainu",
				"url": "https://quiz.aynu.org/",
				"description": "Learn the Ainu language the Duolingo way: free, bite-sized lessons in Latin script and Katakana.",
				"applicationCategory": "EducationalApplication",
				"operatingSystem": "Web",
				"browserRequirements": "Requires JavaScript.",
				"inLanguage": ["ja", "en"],
				"isAccessibleForFree": true,
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
				"teaches": "Ainu language",
				"about": {
					"@type": "Language",
					"name": "Ainu",
					"alternateName": "アイヌ・イタㇰ",
					"sameAs": "https://en.wikipedia.org/wiki/Ainu_language"
				},
				"creator": { "@type": "Organization", "name": "aynumosir" }
			}
		</script>

		<!-- No-flash theme: resolve the saved/system theme before first paint. -->
		<script>
			(function () {
				try {
					var raw = localStorage.getItem('tu-itak:settings:v1');
					var data = raw ? JSON.parse(raw) : {};
					var pref = data.theme || 'system';
					var dark =
						pref === 'dark' ||
						(pref === 'system' &&
							window.matchMedia &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
					if (data.locale) document.documentElement.setAttribute('lang', data.locale);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
