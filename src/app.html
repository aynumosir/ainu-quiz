<!doctype html>
<html lang="ja" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#1c2b4a" />
		<meta name="description" content="tu itak — learn Ainu the Duolingo way" />
		<!-- No-flash theme: resolve the saved/system theme before first paint. -->
		<script>
			(function () {
				try {
					var raw = localStorage.getItem('tu-itak:settings:v1');
					var data = raw ? JSON.parse(raw) : {};
					var pref = data.theme || 'system';
					var dark =
						pref === 'dark' ||
						(pref === 'system' &&
							window.matchMedia &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
					if (data.locale) document.documentElement.setAttribute('lang', data.locale);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
